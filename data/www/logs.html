<!DOCTYPE html><html><head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>System Logs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.toolbar{background:#161b22;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid #30363d}
.toolbar h1{font-size:15px;font-weight:600;margin-right:auto}
.toolbar a{color:#58a6ff;text-decoration:none;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:#f85149}
.dot.ok{background:#3fb950}
.btn-sm,select,input[type=text]{padding:6px 10px;border:1px solid #30363d;border-radius:6px;background:#21262d;color:#c9d1d9;font-size:12px;cursor:pointer}
.btn-sm:hover{background:#30363d}
.btn-sm.on{background:#1f6feb;border-color:#1f6feb;color:#fff}
input[type=text]{cursor:text;width:150px}
#status{padding:4px 12px;font-size:11px;color:#8b949e;background:#161b22;border-bottom:1px solid #30363d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#log{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.a30{color:#484f58}.a31{color:#f85149}.a32{color:#3fb950}.a33{color:#d29922}.a34{color:#58a6ff}.a35{color:#bc8cff}.a36{color:#39c5cf}.a37{color:#c9d1d9}
.a90{color:#6e7681}.a91{color:#ff7b72}.a92{color:#56d364}.a93{color:#e3b341}.a94{color:#79c0ff}.a95{color:#d2a8ff}.a96{color:#56d4dd}.a97{color:#f0f6fc}
.hl{background:rgba(210,153,34,0.18)}
.hid{display:none}
</style></head><body>
<div class='toolbar'>
<a href='/'>&larr; Back</a>
<h1>System Logs</h1>
<span id='dot' class='dot' title='live stream'></span>
<input type='text' id='filter' placeholder='filter (regex)' oninput='apply_filter()'>
<select id='tag' title='log tag'></select>
<select id='level' title='level' onchange='set_level()'>
<option value='error'>error</option><option value='warn'>warn</option><option value='info' selected>info</option><option value='debug'>debug</option>
</select>
<button class='btn-sm' id='pause-btn' onclick='toggle_pause()'>Pause</button>
<button class='btn-sm' onclick='clear_log()'>Clear</button>
<button class='btn-sm' onclick='copy_log()'>Copy</button>
<button class='btn-sm' onclick='download_log()'>Download</button>
<button class='btn-sm on' id='scroll-btn' onclick='toggle_scroll()'>Auto-scroll</button>
</div>
<div id='status'>Connecting…</div>
<div id='log'><div id='anchor'></div></div>
<script>
var log=document.getElementById('log'),dot=document.getElementById('dot'),anchor=document.getElementById('anchor');
var autoScroll=true,paused=false,maxLines=4000,lines=[],pendingText='',filterRe=null,pausedBuf='';
function set_auto(v){autoScroll=v;document.getElementById('scroll-btn').className='btn-sm'+(v?' on':'');}
function toggle_scroll(){set_auto(!autoScroll);if(autoScroll)log.scrollTop=log.scrollHeight;}
function at_bottom(){return log.scrollHeight-log.scrollTop-log.clientHeight<40;}
log.addEventListener('scroll',function(){
  if(autoScroll&&!at_bottom())set_auto(false);
  else if(!autoScroll&&at_bottom())set_auto(true);
});
function toggle_pause(){paused=!paused;document.getElementById('pause-btn').textContent=paused?'Resume':'Pause';document.getElementById('pause-btn').className='btn-sm'+(paused?' on':'');
  if(!paused&&pausedBuf){var t=pausedBuf;pausedBuf='';append_text(t);}}
function clear_log(){log.innerHTML='';anchor=document.createElement('div');anchor.id='anchor';log.appendChild(anchor);lines=[];pendingText='';}
var ansiRe=/\x1b\[([0-9;]*)m/g;
var ansiCls={'30':1,'31':1,'32':1,'33':1,'34':1,'35':1,'36':1,'37':1,'90':1,'91':1,'92':1,'93':1,'94':1,'95':1,'96':1,'97':1};
var letterCls={'E':'a31','W':'a33','I':'a32','D':'a30','V':'a30'};
function render_line(line){
  var wrap=document.createElement('span');
  var hasAnsi=ansiRe.test(line);ansiRe.lastIndex=0;
  if(hasAnsi){
    var last=0,cls=null,m;
    while((m=ansiRe.exec(line))!==null){
      if(m.index>last){var s=document.createElement('span');if(cls)s.className=cls;s.textContent=line.substring(last,m.index);wrap.appendChild(s);}
      var p=m[1].split(';');cls=null;
      for(var i=0;i<p.length;i++){if(ansiCls[p[i]])cls='a'+p[i];}
      last=ansiRe.lastIndex;
    }
    if(last<line.length){var s2=document.createElement('span');if(cls)s2.className=cls;s2.textContent=line.substring(last);wrap.appendChild(s2);}
  }else{
    var ch=line.charAt(0);if(letterCls[ch])wrap.className=letterCls[ch];wrap.textContent=line;
  }
  wrap.appendChild(document.createTextNode('\n'));
  var plain=line.replace(/\x1b\[[0-9;]*m/g,'');
  wrap.dataset.plain=plain;
  if(filterRe&&!filterRe.test(plain))wrap.classList.add('hid');
  return wrap;
}
function append_text(text){
  if(paused){pausedBuf+=text;if(pausedBuf.length>512*1024)pausedBuf=pausedBuf.slice(-512*1024);return;}
  pendingText+=text;
  var idx=pendingText.lastIndexOf('\n');
  if(idx<0){if(pendingText.length>8192){pendingText+='\n';idx=pendingText.length-1;}else return;}
  var complete=pendingText.slice(0,idx);pendingText=pendingText.slice(idx+1);
  var frag=document.createDocumentFragment();
  complete.split('\n').forEach(function(line){if(!line)return;lines.push(line);frag.appendChild(render_line(line));});
  var follow=autoScroll&&at_bottom();
  log.insertBefore(frag,anchor);
  var trimmed=0;
  while(log.childNodes.length>maxLines+1){trimmed+=log.firstChild.offsetHeight||0;log.removeChild(log.firstChild);}
  if(lines.length>maxLines)lines.splice(0,lines.length-maxLines);
  if(follow)log.scrollTop=log.scrollHeight;else if(trimmed)log.scrollTop=Math.max(0,log.scrollTop-trimmed);
}
function apply_filter(){
  var v=document.getElementById('filter').value;
  try{filterRe=v?new RegExp(v,'i'):null;}catch(e){filterRe=null;}
  var n=log.childNodes;
  for(var i=0;i<n.length;i++){var el=n[i];if(el.id==='anchor')continue;
    if(filterRe&&!filterRe.test(el.dataset.plain||''))el.classList.add('hid');else el.classList.remove('hid');}
}
function set_status(t){document.getElementById('status').textContent=t;}
var ws=null,boot='',wsBytes=0;
function connect(){
  ws=new WebSocket('ws://'+location.host+'/ws/logs');
  ws.onopen=function(){dot.classList.add('ok');set_status('Live · connected');};
  ws.onclose=function(){dot.classList.remove('ok');set_status('Disconnected · reconnecting…');setTimeout(connect,2000);};
  ws.onerror=function(){dot.classList.remove('ok');};
  ws.onmessage=function(e){wsBytes+=e.data.length;append_text(e.data);};
}
async function refresh_status(){
  try{var r=await fetch('/api/logs/level',{cache:'no-store'});var d=await r.json();
    if(d.success){var sel=document.getElementById('tag');if(sel.options.length===0){d.tags.forEach(function(t){var o=document.createElement('option');o.value=t.tag;o.textContent=t.tag==='*'?'* (all tags)':t.tag;sel.appendChild(o);});sel.onchange=sync_level_select;}
      window.tagLevels={};d.tags.forEach(function(t){window.tagLevels[t.tag]=t.level;});sync_level_select();
      set_status('Live · journal '+Math.round(d.journal_bytes/1024)+' KB · max compiled level '+d.max_compiled+(d.truncated_lines?' · truncated lines '+d.truncated_lines:'')+' · received '+Math.round(wsBytes/1024)+' KB');}}
  catch(e){}
}
function sync_level_select(){var t=document.getElementById('tag').value;var l=(window.tagLevels||{})[t];if(l)document.getElementById('level').value=l;}
async function set_level(){
  var tag=document.getElementById('tag').value,level=document.getElementById('level').value;
  try{await fetch('/api/logs/level',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tag:tag,level:level})});refresh_status();}
  catch(e){set_status('Cannot set level: '+e.message);}
}
function plain_text(){return lines.map(function(l){return l.replace(/\x1b\[[0-9;]*m/g,'');}).join('\n')+'\n';}
async function copy_log(){
  var t=plain_text();
  try{await navigator.clipboard.writeText(t);set_status('Copied '+lines.length+' lines to clipboard');}
  catch(e){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();set_status('Copied '+lines.length+' lines');}
}
function download_log(){
  // Full retained journal from the device (not only what this tab saw).
  var a=document.createElement('a');a.href='/api/logs/download';a.download='fable.log';document.body.appendChild(a);a.click();a.remove();
}
connect();refresh_status();setInterval(refresh_status,15000);
</script></body></html>
